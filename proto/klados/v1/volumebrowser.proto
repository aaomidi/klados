syntax = "proto3";

package klados.v1;

import "klados/v1/resource.proto";

// VolumeBrowserService mirrors internal/services.VolumeBrowserService.
service VolumeBrowserService {
  rpc Spawn(VolumeBrowserSpawnRequest) returns (JsonResponse);
  rpc Stop(VolumeBrowserIDRequest) returns (EmptyResponse);
  rpc Replace(VolumeBrowserReplaceRequest) returns (JsonResponse);
  rpc AttachTab(VolumeBrowserAttachTabRequest) returns (EmptyResponse);
  rpc ListManaged(ContextRequest) returns (JsonResponse);
  rpc ScanOrphans(ContextRequest) returns (JsonResponse);
  rpc CleanupOrphans(ContextRequest) returns (EmptyResponse);
  rpc TriggerOrphanScan(ContextRequest) returns (JsonResponse);
}

message VolumeBrowserSpawnRequest {
  // JSON-encoded services.SpawnRequestDTO.
  bytes request_json = 1;
}

message VolumeBrowserIDRequest {
  string id = 1;
}

message VolumeBrowserReplaceRequest {
  string id = 1;
  // JSON-encoded services.SpawnRequestDTO.
  bytes request_json = 2;
}

message VolumeBrowserAttachTabRequest {
  string id = 1;
  string tab_id = 2;
}
