syntax = "proto3";

package klados.v1;

// EventService is the push plane of the split server. It replaces the Wails
// event bus: each frontend Events.On(topic) opens one Subscribe stream
// (multiplexed over HTTP/2), and cancelling the stream unsubscribes.
//
// Events are coalesced server-side into batches (flush-window based) so a
// burst of Kubernetes watch events becomes one frame instead of N.
service EventService {
  rpc Subscribe(SubscribeRequest) returns (stream EventBatch);
  // Publish lets a client inject an event into the hub — used for
  // window-to-window coordination (pop-out panels) that previously rode the
  // Wails event bus.
  rpc Publish(PublishRequest) returns (PublishResponse);
}

message PublishRequest {
  Event event = 1;
}

message PublishResponse {}

message SubscribeRequest {
  // Exact event names, e.g. "watch:{ctx}:{gvr}:{ns}", "status:{ctx}:connection".
  // Topics are opaque strings matched exactly — same semantics as Events.On.
  repeated string topics = 1;
}

message EventBatch {
  repeated Event events = 1;
}

message Event {
  string name = 1;
  // JSON-encoded payload, exactly what the Wails event carried in `data`.
  // Empty for nil-payload events (e.g. "config:updated").
  bytes payload_json = 2;
}
